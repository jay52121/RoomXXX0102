name: Temporary SISP Web Finish Check

on:
  push:
    branches:
      - codex/sisp-web-v1-finish

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Check browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("app/src/main/assets/sisp_debug.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/sisp-web-finish.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/sisp-web-finish.js
      - name: Kotlin compile and unit tests
        run: |
          chmod +x gradlew
          touch kws-sdk/consumer-rules.pro
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace
