name: Portal V4 Android verification
on:
  push:
    branches: [codex/portal-v4-three-methods]
    paths: [.github/workflows/portal-v4-verify.yml]
permissions:
  contents: write
concurrency:
  group: portal-v4-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply verified implementation and run Android validation
        run: python tools/_portal_v4_apply.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-v4-validation
          path: |
            /tmp/portal-v4-report.json
            /tmp/portal-v4-build.log
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: portal-v4-android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            docs/portal_v4/*.md
          retention-days: 14
          if-no-files-found: error
