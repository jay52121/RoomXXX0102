name: Portal V4.2 episode core

on:
  push:
    branches:
      - codex/portal-v42-episode-core

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply V4.2 integration patch
        run: python tools/patch_portal_v42_core.py
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Remove temporary patch machinery
        run: python -c "from pathlib import Path; [p.unlink() for p in [Path('.github/workflows/portal-v42-episode-core.yml'), Path('tools/patch_portal_v42_core.py')] if p.exists()]"
      - name: Commit verified V4.2 source
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A app/src/main/java/com/example/roomxxx0102/logic/roomalgorithm/gate app/src/test/java/com/example/roomxxx0102/logic/roomalgorithm/gate .github/workflows/portal-v42-episode-core.yml tools/patch_portal_v42_core.py
          git commit -m "feat: replace V4 transition core with portal episodes"
          git push origin HEAD:codex/portal-v42-episode-core
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portal-v42-episode-core-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
