name: Temporary UX Archive
on:
  push:
    branches:
      - codex/manual-portal-binding-ux-v2
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/manual-portal-binding-ux-v2
      - run: python3 tools/_manual_portal_ux_history_patch.py
      - run: |
          git config user.name codex-bot
          git config user.email codex-bot@users.noreply.github.com
          git add codexHistory.md dialogueHistory.md tools/_dialogue_user_current.txt tools/_dialogue_assistant_current.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs: 归档人工事件房门绑定交互优化"
            git push origin HEAD:codex/manual-portal-binding-ux-v2
          fi
