name: temporary raw pose inference patch

on:
  push:
    branches:
      - codex/inferred-portal-truth-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/inferred-portal-truth-ui
          fetch-depth: 0
      - name: Apply source patch only
        run: python3 tools/_patch_raw_pose_inference.py
      - name: Verify source markers
        run: |
          grep -q 'recordFrame(it, results)' app/src/main/java/com/example/roomxxx0102/ui/activities/MainActivity.kt
          grep -q 'rawPoses: List<PoseResult>' app/src/main/java/com/example/roomxxx0102/logic/validation/EventDiagnosticRecorder.kt
          grep -q '原始Pose人体框' app/src/main/java/com/example/roomxxx0102/logic/validation/EventDiagnosticRecorder.kt
      - name: Commit source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/roomxxx0102/logic/validation/EventDiagnosticRecorder.kt app/src/main/java/com/example/roomxxx0102/ui/activities/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No source change needed'
          else
            git commit -m '诊断：门位推断直接使用原始 Pose 人体框'
            git push origin HEAD:codex/inferred-portal-truth-ui
          fi
