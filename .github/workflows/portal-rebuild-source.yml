name: Portal rebuild source snapshot
on:
  workflow_dispatch:
  push:
    branches: ['codex/portal-rebuild-evidence-20261013']
    paths: ['.github/workflows/portal-rebuild-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package only algorithm sources and replay fixtures
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('.')
          folders = ['app/src/main/java/com/example/roomxxx0102/logic/roomalgorithm', 'app/src/test/java/com/example/roomxxx0102/logic/roomalgorithm', 'app/src/test/resources', 'docs/portal_rebuild']
          with zipfile.ZipFile('portal-rebuild-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for folder in folders:
                  for p in sorted((root / folder).rglob('*')):
                      if p.is_file(): z.write(p, p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portal-rebuild-source
          path: portal-rebuild-source.zip
          retention-days: 7
