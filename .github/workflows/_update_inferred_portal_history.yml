name: temporary inferred portal history update

on:
  push:
    branches:
      - codex/inferred-portal-truth-ui

permissions:
  contents: write

jobs:
  history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/inferred-portal-truth-ui
          fetch-depth: 0
      - name: Update codex history
        run: python3 tools/_update_inferred_portal_history.py
      - name: Archive dialogue verbatim
        run: python3 tools/dialogue_archive.py append-turn --user-file tools/_dialogue_user_current.txt --assistant-file tools/_dialogue_assistant_current.txt --title "人工事件自动推断房门验证" --history-file dialogueHistory.md
      - name: Commit histories
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codexHistory.md dialogueHistory.md
          if git diff --cached --quiet; then
            echo 'No history changes needed'
          else
            git commit -m '历史：记录人工事件门位推断验证'
            git push origin HEAD:codex/inferred-portal-truth-ui
          fi
