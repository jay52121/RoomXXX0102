name: Event Diagnostic Runtime CI

on:
  push:
    branches:
      - codex/event-diagnostic-recorder-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply runtime replay patch
        run: python3 tools/_patch_event_diagnostic_runtime.py
      - name: CI packaging compatibility
        run: touch kws-sdk/consumer-rules.pro
      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main
          if git diff --cached --quiet; then
            echo no-generated-changes
          else
            git commit -m event-diagnostic-runtime-applied
            git push origin HEAD:codex/event-diagnostic-recorder-v1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: event-diagnostic-recorder-debug
          path: app/build/outputs/apk/debug/*.apk
