name: Portal acceptance evaluator tests

on:
  pull_request:
    paths:
      - 'tools/portal_acceptance/**'
      - 'docs/portal_boundary/**'
      - '.github/workflows/portal-contracts.yml'
  push:
    paths:
      - 'tools/portal_acceptance/**'
      - 'docs/portal_boundary/**'
      - '.github/workflows/portal-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify evaluator behavior, not product detection accuracy
        run: python -m unittest discover -s tools/portal_acceptance -p 'test_*.py' -v
      - name: Verify command syntax
        run: python tools/portal_acceptance/strict_portal_acceptance.py --help
