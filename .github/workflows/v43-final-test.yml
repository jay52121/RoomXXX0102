name: Final Test V4.3

on:
  push:
    branches:
      - codex/v43-continuity-absorption

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v43-continuity-absorption
          fetch-depth: 0
      - name: Fix veto test trajectory
        run: python3 tools/_v43_fix_veto_test.py
      - name: Remove temporary files
        run: rm tools/_v43_fix_veto_test.py .github/workflows/v43-final-test.yml
      - name: Commit final test fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "测试：路过门洞轨迹保持同一人体连续性"
          git push origin HEAD:codex/v43-continuity-absorption
      - name: Unit tests
        run: bash gradlew :app:testDebugUnitTest --no-daemon
