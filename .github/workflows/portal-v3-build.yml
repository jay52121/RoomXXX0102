name: Portal V3 Android validation
on:
  push:
    branches: [codex/portal-v3-flow]
    paths:
      - .github/workflows/portal-v3-build.yml
      - tools/_portal_v3_apply.py
permissions:
  contents: write
concurrency:
  group: portal-v3-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final review
        run: python tools/_portal_v3_review.py
      - name: Apply, test, build, archive and commit
        run: python tools/_portal_v3_apply.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-v3-validation-report
          path: |
            /tmp/portal-v3-report.json
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: portal-v3-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
