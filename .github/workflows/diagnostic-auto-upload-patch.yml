name: Diagnostic Auto Upload Patch

on:
  push:
    branches:
      - codex/diagnostic-auto-upload

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact source patch
        run: python3 tools/_patch_diagnostic_auto_upload.py
      - name: Commit patched source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/roomxxx0102/ui/activities/MainActivity.kt codexHistory.md
          if git diff --cached --quiet; then
            echo no-generated-changes
          else
            git commit -m '诊断录制完成后自动上传 GitHub'
            git push origin HEAD:codex/diagnostic-auto-upload
          fi
