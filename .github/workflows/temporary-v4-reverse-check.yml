name: Temporary V4 Reverse Crossing Test
on:
  push:
    branches:
      - codex/v4-wait-clear-reverse-replay-20261012
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Kotlin compilation and gate core unit tests
        run: |
          chmod +x gradlew
          touch kws-sdk/consumer-rules.pro
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace
