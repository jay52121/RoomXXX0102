name: Update Portal V4.1 codex history
on:
  push:
    branches:
      - codex/portal-v4-event-roi
    paths:
      - .github/workflows/archive-portal-v41-current-turn.yml
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert newest-first codex entry
        run: |
          python -c "from pathlib import Path; p=Path('codexHistory.md'); t=p.read_text(encoding='utf-8'); e=Path('tools/_codex_entry_current.txt').read_text(encoding='utf-8'); m='# Codex History\\n\\n'; assert t.startswith(m); p.write_text(t if e.splitlines()[0] in t else m+e+t[len(m):],encoding='utf-8')"
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add codexHistory.md
          git commit -m "docs: record Portal V4.1 Event ROI redesign"
          git push origin HEAD:codex/portal-v4-event-roi
