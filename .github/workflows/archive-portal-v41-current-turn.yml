name: Archive Portal V4.1 implementation history
on:
  push:
    branches: [codex/portal-v4-event-roi]
    paths: [.github/workflows/archive-portal-v41-current-turn.yml]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update codex history and archive dialogue with project script
        run: |
          python - <<'PY'
          from pathlib import Path
          history = Path('codexHistory.md')
          text = history.read_text(encoding='utf-8')
          entry = '''## [405] 2026-09-16 19:45:00 - V4.1 Event ROI 门口事件视觉重构

**用户指令**：
> 我在本地做了一个小修改，提交，然后接下来也按照我们刚才说的东西重改吧

**实现方案**：

* **基线保留**：以用户本地提交 `912131e`（房间算法日志合并到调试面板）为新基线，完整保留该 UI/日志改动。
* **事件调度**：新增 `GateActivityScheduler`，门状态改为 OFF / ARMED / ACTIVE / HOLD；未正式锁定但达到较低 person 分数的 YOLO/Tracker 候选可以提前 ARMED，只有下半身/脚点真实靠近门才 ACTIVE，候选本身不能修改人数。
* **只处理相关门**：默认最多同时运行 2 扇 ACTIVE/HOLD 门；无人在门口时差分、MOG2、LK 全部停止。所有门只以约 10fps 保存约 1 秒局部灰度 pre-roll，不形成待算工作队列。
* **高分辨率局部图**：删除旧 `GateVision.kt` / `GateLk.kt` 的整帧 `480/640` 工作图路径；默认 `captureEdge=2560`，当前约 2232 宽视频不因 Portal 再缩小，直接从源截图按每扇 Portal 裁高分辨率 ROI。
* **三方案同步重构**：A 只在活跃门做局部固定参考差分；B 只在活跃门裁块做 15×15 正反向 LK、默认 128 点并支持单门短历史逆向来源核验；C 只在事件开始后用该门 pre-roll 预热 OpenCV MOG2，事件期间冻结学习。
* **出门回溯**：严格 Tracker 通常约 0.5 秒后锁定人体时，只回溯当前几何候选的一扇门最近约 1 秒历史；A/C 看局部前景由空到有人，B 可追加逆向 LK，不回放其他门，更不补算整段历史队列。
* **差分精度/显示**：取消旧 4×8 黄色大砖块显示，真实前景在源分辨率门 ROI 内像素级计算；调试层直接画 `findContours` 得到的黄色半透明真实轮廓。内部 ownership 覆盖改为更细的 8×12 统计，HOLD 膨胀降为 3×3。
* **全局保护**：整图灰度/整图 absdiff 已移除，只保留 24 个稀疏亮度采样点检测整体曝光/机位突变。
* **设置迁移**：新增历史长度、HOLD、候选分数、靠门距离、裁块 padding、最大活跃门、轮廓面积等参数；旧 V4 保存配置首次读取时不再沿用原整图缩放语义。
* **验证**：`:app:testDebugUnitTest` 与 `:app:assembleDebug` 通过；87 项单测，失败 0、错误 0、跳过 0。Debug APK `128269700` bytes，SHA256 `30856028131dc517ad0010663ddbed1a7238bc58e3da38f21f480f6e10c64fca`，仅 `arm64-v8a`；YOLO26 detection / pose w8a32 资产 SHA256 保持 `7a598838082251ef8e1d3b8f06f356ad532f8fe3a24c7eeeed68b52d28525036` / `8409d9109f1bb374e28a9ff925205580e62cbcf73528b11777b667f8e28611f8`。
* **边界**：本轮验证证明编译、单测和 APK 完整性，不声称真机已达到 10/20fps，也不声称真实测试视频准确率；面板已显示活跃门数、历史 KB、Pose/视觉/整轮耗时用于实测。

---

'''
          marker = '# Codex History\n\n'
          if entry.splitlines()[0] not in text:
              if not text.startswith(marker):
                  raise SystemExit('unexpected codexHistory header')
              history.write_text(marker + entry + text[len(marker):], encoding='utf-8')

          user = '我在本地做了一个小修改，提交，然后接下来也按照我们刚才说的东西重改吧'
          assistant = '可以。先把你刚才本地那次小修改作为新的基线保住，然后我会按刚才讨论的方向重构：**候选人体触发门、通常只激活 0–2 扇门；高分辨率源图直接裁 Portal；未激活门不做差分；保留约 1 秒门 ROI 回溯；差分显示改成真实像素级 mask，不再用 4×8 大块代表前景。**'
          Path('tools/_dialogue_user_current.txt').write_text(user, encoding='utf-8')
          Path('tools/_dialogue_assistant_current.txt').write_text(assistant, encoding='utf-8')
          PY
          python tools/dialogue_archive.py append-turn --user-file tools/_dialogue_user_current.txt --assistant-file tools/_dialogue_assistant_current.txt --title "V4.1 Event ROI 门口事件视觉重构" --history-file dialogueHistory.md
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add codexHistory.md dialogueHistory.md tools/_dialogue_user_current.txt tools/_dialogue_assistant_current.txt
          git commit -m "docs: archive Portal V4.1 Event ROI redesign"
          git push origin HEAD:codex/portal-v4-event-roi
