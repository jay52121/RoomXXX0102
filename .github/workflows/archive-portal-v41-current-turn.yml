name: Archive Portal V4.1 dialogue
on:
  push:
    branches:
      - codex/portal-v4-event-roi
    paths:
      - .github/workflows/archive-portal-v41-current-turn.yml
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact turn
        run: python tools/dialogue_archive.py append-turn --user-file tools/_dialogue_user_current.txt --assistant-file tools/_dialogue_assistant_current.txt --title "V4.1 Event ROI 门口事件视觉重构" --time "2026-09-16 19:45:00" --history-file dialogueHistory.md
      - name: Commit archive
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add dialogueHistory.md
          git commit -m "docs: archive Portal V4.1 Event ROI dialogue"
          git push origin HEAD:codex/portal-v4-event-roi
