name: Apply V4.3 Continuity Absorption

on:
  push:
    branches:
      - codex/v43-continuity-absorption

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v43-continuity-absorption
          fetch-depth: 0
      - name: Apply V4.3 patch
        run: python3 tools/_apply_v43.py
      - name: Remove temporary patch workflow
        run: rm tools/_apply_v43.py .github/workflows/v43-apply.yml
      - name: Commit V4.3 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V4.3：保留稀疏帧连续性并加入整人融入判据"
          git push origin HEAD:codex/v43-continuity-absorption
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
