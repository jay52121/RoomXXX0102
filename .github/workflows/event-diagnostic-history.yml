name: Event Diagnostic History

on:
  push:
    branches:
      - codex/event-diagnostic-recorder-v1

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize histories
        run: python3 tools/_finalize_event_diag_history.py
      - name: Commit histories
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codexHistory.md dialogueHistory.md
          if git diff --cached --quiet; then
            echo no-history-changes
          else
            git commit -m event-diagnostic-history-finalized
            git push origin HEAD:codex/event-diagnostic-recorder-v1
          fi
