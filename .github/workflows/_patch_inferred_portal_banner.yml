name: temporary inferred portal banner patch

on:
  push:
    branches:
      - codex/inferred-portal-truth-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/inferred-portal-truth-ui
          fetch-depth: 0
      - name: Apply source patch only
        run: python3 tools/_patch_inferred_portal_banner.py
      - name: Verify inserted source markers
        run: |
          grep -q 'MarkedPortalInferenceOverlayBus' app/src/main/java/com/example/roomxxx0102/ui/views/DetectionOverlayView.kt
          grep -q '【推断进出】' app/src/main/java/com/example/roomxxx0102/logic/validation/EventDiagnosticRecorder.kt
          grep -q 'drawInferredPortalBanner' app/src/main/java/com/example/roomxxx0102/ui/views/DetectionOverlayView.kt
      - name: Commit source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/roomxxx0102/ui/views/DetectionOverlayView.kt
          if git diff --cached --quiet; then
            echo 'No source change needed'
          else
            git commit -m '诊断：区分显示推断进出提示'
            git push origin HEAD:codex/inferred-portal-truth-ui
          fi
