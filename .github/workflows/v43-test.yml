name: Test V4.3 Continuity Absorption

on:
  push:
    branches:
      - codex/v43-continuity-absorption

permissions:
  contents: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v43-continuity-absorption
          fetch-depth: 0
      - name: Unit tests
        run: bash gradlew :app:testDebugUnitTest --no-daemon
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/v43-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "清理 V4.3 临时测试 workflow"
            git push origin HEAD:codex/v43-continuity-absorption
          fi
