name: Event Diagnostic Recorder CI

on:
  push:
    branches:
      - codex/event-diagnostic-recorder-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply recorder patch
        run: python3 tools/_apply_event_diagnostic_recorder.py
      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main app/src/test
          if git diff --cached --quiet; then
            echo no-generated-changes
          else
            git commit -m event-diagnostic-recorder-applied
            git push origin HEAD:codex/event-diagnostic-recorder-v1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: event-diagnostic-recorder-debug
          path: app/build/outputs/apk/debug/*.apk
