          assert old in vision
          vision = vision.replace(old, new, 1)

          old = '''        }catch(e:Exception){
            current.values.forEach{runCatching{it.release()}}
'''
          new = '''        }catch(e:Exception){
            GateMaskDebug.clear()
            current.values.forEach{runCatching{it.release()}}
'''
          assert old in vision
          vision = vision.replace(old, new, 1)

          old = '''        states.values.forEach{it.release()};states.clear();scheduler.reset();lk?.reset();sourceWidth=w;sourceHeight=h;previousTime=-1;sceneSamples=null
'''
          new = '''        states.values.forEach{it.release()};states.clear();GateMaskDebug.clear();scheduler.reset();lk?.reset();sourceWidth=w;sourceHeight=h;previousTime=-1;sceneSamples=null
