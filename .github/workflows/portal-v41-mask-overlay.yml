      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit verified source changes
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add app/src/main/java/com/example/roomxxx0102/logic/roomalgorithm/gate/GateMaskDebug.kt app/src/main/java/com/example/roomxxx0102/logic/roomalgorithm/gate/GateEventVisionV2.kt app/src/main/java/com/example/roomxxx0102/logic/roomalgorithm/gate/GateOverlay.kt app/src/test/java/com/example/roomxxx0102/logic/roomalgorithm/gate/GateMaskDebugTest.kt
          git commit -m "debug: render exact Portal pixel masks"
          git push origin HEAD:codex/portal-v41-mask-overlay-final
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portal-v41-exact-mask-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
