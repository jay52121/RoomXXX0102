          assert old in vision
          vision = vision.replace(old, new, 1)

          old = '''    override fun close(){states.values.forEach{it.release()};states.clear();scheduler.reset();lk?.reset();openKernel.release();growKernel.release();sceneSamples=null}
'''
          new = '''    override fun close(){states.values.forEach{it.release()};states.clear();GateMaskDebug.clear();scheduler.reset();lk?.reset();openKernel.release();growKernel.release();sceneSamples=null}
'''
          assert old in vision
          vision = vision.replace(old, new, 1)
          vision_path.write_text(vision, encoding='utf-8')

          overlay_path = pkg / 'GateOverlay.kt'
          overlay = overlay_path.read_text(encoding='utf-8')
          overlay = overlay.replace('import android.graphics.Path\n', '', 1)

          old = '''        lines+="黄色轮廓=真实局部门前景  绿色线=B版局部双向光流"
'''
          new = '''        val masks=s.v?.tiles.orEmpty().mapNotNull { GateMaskDebug.snapshot(it.gate) }
        lines+="像素 动态 ${masks.sumOf{it.motionPixels}}  背景差 ${masks.sumOf{it.backgroundPixels}}  人体 ${masks.sumOf{it.ownedPixels}}"
        lines+="黄色=逐像素帧间变化  橙色=逐像素参考背景差  青色=人体归属  绿色线=B版光流"
'''
          assert old in overlay
          overlay = overlay.replace(old, new, 1)

          start = overlay.index('        // Draw the actual foreground contours. The old 4x8 filled debug bricks are deliberately gone.')
          end = overlay.index('            paint.style=Paint.Style.FILL\n            paint.color=when(tile.phase)', start)
          replacement = '''        fun drawMaskRuns(runs:List<GatePixelRun>,color:Int) {
            paint.style=Paint.Style.FILL
            paint.color=color
            paint.isAntiAlias=false
            runs.forEach { run ->
                canvas.drawRect(x(run.left),y(run.top),x(run.right),y(run.bottom),paint)
            }
            paint.isAntiAlias=true
        }

        // Exact-pixel debug rendering. Horizontal runs are only a compact transport format: every
        // painted source pixel was non-zero in the corresponding binary mask; holes stay unpainted.
        for(tile in s.v?.tiles.orEmpty()) {
            if(tile.phase==GateSensorPhase.OFF) continue
            GateMaskDebug.snapshot(tile.gate)?.let { mask ->
                drawMaskRuns(mask.backgroundRuns,Color.argb(72,255,128,0))
                drawMaskRuns(mask.motionRuns,Color.argb(145,255,235,0))
                drawMaskRuns(mask.ownedRuns,Color.argb(190,0,220,255))
            }
'''
          overlay = overlay[:start] + replacement + overlay[end:]
          overlay_path.write_text(overlay, encoding='utf-8')
