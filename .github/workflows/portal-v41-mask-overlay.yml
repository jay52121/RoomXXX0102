name: Portal V4.1 exact pixel mask overlay
on:
  push:
    branches:
      - codex/portal-v41-mask-overlay-final
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply precise visualization patch
        run: python tools/patch_portal_mask_overlay.py
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Remove temporary patch machinery
        run: python -c "from pathlib import Path; [p.unlink() for p in [Path('.github/workflows/portal-v41-mask-overlay.yml'), Path('tools/patch_portal_mask_overlay.py')] if p.exists()]"
      - name: Commit verified source changes
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A app/src/main/java/com/example/roomxxx0102/logic/roomalgorithm/gate app/src/test/java/com/example/roomxxx0102/logic/roomalgorithm/gate .github/workflows/portal-v41-mask-overlay.yml tools/patch_portal_mask_overlay.py
          git commit -m "debug: render exact Portal pixel masks"
          git push origin HEAD:codex/portal-v41-mask-overlay-final
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portal-v41-exact-mask-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
