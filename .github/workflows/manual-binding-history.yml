name: Manual Binding History

on:
  push:
    branches:
      - codex/manual-binding-finish

jobs:
  history:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/manual-binding-finish
      - run: python3 tools/_manual_binding_history_patch.py
      - run: |
          git config user.name codex-bot
          git config user.email codex-bot@users.noreply.github.com
          git add codexHistory.md dialogueHistory.md tools/_dialogue_user_current.txt tools/_dialogue_assistant_current.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs: 归档手工房门绑定任务"
            git push origin HEAD:codex/manual-binding-finish
          fi
