name: Temporary Web Debug Archive
on:
  push:
    branches:
      - codex/sisp-structured-web-debug-v1
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sisp-structured-web-debug-v1
      - name: Archive dialogue and code history
        run: python3 tools/_sisp_web_debug_archive_patch.py
      - name: Commit and push archive
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add codexHistory.md dialogueHistory.md tools/_dialogue_user_current.txt tools/_dialogue_assistant_current.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs: 归档结构化网页调试台 V1"
            git push origin HEAD:codex/sisp-structured-web-debug-v1
          fi
