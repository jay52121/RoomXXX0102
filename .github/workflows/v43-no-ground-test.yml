name: Test V4.3 Occluded Passby

on:
  push:
    branches:
      - codex/v43-continuity-absorption

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v43-continuity-absorption
          fetch-depth: 0
      - name: Apply occluded pass-by test
        run: python3 tools/_v43_no_ground_veto_test.py
      - name: Remove temporary files
        run: rm tools/_v43_no_ground_veto_test.py .github/workflows/v43-no-ground-test.yml
      - name: Commit test scenario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "测试：覆盖儿童房下肢遮挡路过场景"
          git push origin HEAD:codex/v43-continuity-absorption
      - name: Unit tests
        run: bash gradlew :app:testDebugUnitTest --no-daemon
