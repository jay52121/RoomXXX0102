name: Dialogue Archive Current

on:
  push:
    branches:
      - codex/diagnostic-auto-upload

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive current turn
        run: python3 tools/dialogue_archive.py append-turn --user-file tools/_dialogue_user_current.txt --assistant-file tools/_dialogue_assistant_current.txt --title "诊断录制自动上传 GitHub" --time "2026-09-17 03:05:00" --history-file dialogueHistory.md
      - name: Commit dialogue history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dialogueHistory.md
          if git diff --cached --quiet; then
            echo no-dialogue-history-change
          else
            git commit -m '归档诊断自动上传对话原文'
            git push origin HEAD:codex/diagnostic-auto-upload
          fi
