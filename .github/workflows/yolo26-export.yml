name: Temporary YOLO26 Android validation

on:
  push:
    branches:
      - "9月新房间判定算法"
    paths:
      - ".github/workflows/yolo26-export.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "9月新房间判定算法"
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Finalize YOLO26 integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/_yolo26_finalize.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('["./gradlew",', '["bash", "gradlew",')
          text = text.replace(
              '    user_file.unlink()\n    assistant_file.unlink()\n',
              '    run(["git", "checkout", "--", str(user_file.relative_to(ROOT)), str(assistant_file.relative_to(ROOT))])\n'
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          python tools/_yolo26_finalize.py
