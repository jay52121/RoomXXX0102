name: Temporary YOLO26 Android validation

on:
  push:
    branches:
      - "9月新房间判定算法"
    paths:
      - ".github/workflows/yolo26-export.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "9月新房间判定算法"
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Finalize YOLO26 integration
        run: python tools/_yolo26_finalize.py
