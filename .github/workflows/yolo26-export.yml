name: Temporary YOLO26 Android validation

on:
  push:
    branches:
      - "9月新房间判定算法"
    paths:
      - ".github/workflows/yolo26-export.yml"

permissions:
  contents: write

jobs:
  integrate-validate-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "9月新房间判定算法"
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Patch Android analyzers for YOLO26
        run: |
          python - <<'PY'
          from pathlib import Path

          yolo = Path("app/src/main/java/com/example/roomxxx0102/logic/analyzer/YoloAnalyzer.kt")
          text = yolo.read_text(encoding="utf-8")
          old = '''    companion object {
        private const val MODEL_FILE_NAME = "yolo11s_float16.tflite"
        private const val TAG = "YoloAnalyzer"
    }'''
          new = '''    companion object {
        private const val MODEL_FILE_NAME = "yolo26s_float16.tflite"
        private const val MODEL_ARCHITECTURE = "YOLO26s"
        private const val TAG = "YoloAnalyzer"
    }'''
          if old not in text:
              raise SystemExit("YoloAnalyzer companion snippet not found")
          text = text.replace(old, new, 1)
          old = '''    private var interpreter: Interpreter? = null
    private var inputWidth = 640'''
          new = '''    private var interpreter: Interpreter? = null
    private var gpuDelegate: GpuDelegate? = null
    private var inputWidth = 640'''
          if old not in text:
              raise SystemExit("YoloAnalyzer interpreter field snippet not found")
          text = text.replace(old, new, 1)
          old = '''            val options = Interpreter.Options()
            try {
                options.addDelegate(GpuDelegate())
                Log.d(TAG, "🚀 GPU 加速已开启")
            } catch (e: Exception) {
                options.setUseXNNPACK(true)
                options.setNumThreads(4)
                Log.e(TAG, "⚠️ GPU 失败，使用 XNNPACK")
            }
            interpreter = Interpreter(modelBuffer, options)
            val inputShape = interpreter!!.getInputTensor(0).shape()
            if (inputShape[1] == 3) { inputHeight = inputShape[2]; inputWidth = inputShape[3] }
            else { inputHeight = inputShape[1]; inputWidth = inputShape[2] }

            tensorImage = TensorImage(DataType.FLOAT32)
            val outputShape = interpreter!!.getOutputTensor(0).shape()
            val dim1 = outputShape[1]; val dim2 = outputShape[2]
            if (dim1 < dim2) { isChannelsFirst = true; numClasses = dim1 - 4; numBoxes = dim2 }
            else { isChannelsFirst = false; numClasses = dim2 - 4; numBoxes = dim1 }
            outputData = Array(1) { Array(dim1) { FloatArray(dim2) } }'''
          new = '''            interpreter = createInterpreterWithFallback(modelBuffer)
            val activeInterpreter = interpreter!!
            require(activeInterpreter.inputTensorCount == 1) {
                "$MODEL_ARCHITECTURE expects exactly 1 input tensor, got ${activeInterpreter.inputTensorCount}"
            }
            require(activeInterpreter.outputTensorCount == 1) {
                "$MODEL_ARCHITECTURE expects exactly 1 output tensor, got ${activeInterpreter.outputTensorCount}"
            }

            val inputTensor = activeInterpreter.getInputTensor(0)
            val inputShape = inputTensor.shape()
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE input[0]=" +
                    "shape=${inputShape.contentToString()} dtype=${inputTensor.dataType()}"
            )
            require(inputTensor.dataType() == DataType.FLOAT32) {
                "$MODEL_ARCHITECTURE input dtype must be FLOAT32, got ${inputTensor.dataType()}"
            }
            require(inputShape.contentEquals(intArrayOf(1, 640, 640, 3))) {
                "$MODEL_ARCHITECTURE unexpected input shape ${inputShape.contentToString()}"
            }
            inputHeight = inputShape[1]
            inputWidth = inputShape[2]

            tensorImage = TensorImage(DataType.FLOAT32)
            val outputTensor = activeInterpreter.getOutputTensor(0)
            val outputShape = outputTensor.shape()
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE output[0]=" +
                    "shape=${outputShape.contentToString()} dtype=${outputTensor.dataType()}"
            )
            require(outputTensor.dataType() == DataType.FLOAT32) {
                "$MODEL_ARCHITECTURE output dtype must be FLOAT32, got ${outputTensor.dataType()}"
            }
            require(outputShape.contentEquals(intArrayOf(1, 84, 8400))) {
                "$MODEL_ARCHITECTURE unexpected output shape ${outputShape.contentToString()}"
            }
            val dim1 = outputShape[1]
            val dim2 = outputShape[2]
            isChannelsFirst = true
            numClasses = dim1 - 4
            numBoxes = dim2
            outputData = Array(1) { Array(dim1) { FloatArray(dim2) } }
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE ready=true " +
                    "classes=$numClasses boxes=$numBoxes externalNms=true"
            )'''
          if old not in text:
              raise SystemExit("YoloAnalyzer setup snippet not found")
          text = text.replace(old, new, 1)
          marker = '''    override fun analyze(image: ImageProxy) {'''
          helper = '''    private fun createInterpreterWithFallback(modelBuffer: java.nio.ByteBuffer): Interpreter {
        var candidateDelegate: GpuDelegate? = null
        try {
            candidateDelegate = GpuDelegate()
            val gpuOptions = Interpreter.Options().apply { addDelegate(candidateDelegate) }
            val gpuInterpreter = Interpreter(modelBuffer, gpuOptions)
            gpuDelegate = candidateDelegate
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE gpuDelegate=true backend=GPU"
            )
            return gpuInterpreter
        } catch (gpuError: Throwable) {
            try {
                candidateDelegate?.close()
            } catch (_: Throwable) {
            }
            gpuDelegate = null
            Log.w(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE gpuDelegate=false fallback=XNNPACK",
                gpuError
            )
        }

        modelBuffer.rewind()
        val cpuOptions = Interpreter.Options().apply {
            setUseXNNPACK(true)
            setNumThreads(4)
        }
        return Interpreter(modelBuffer, cpuOptions).also {
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE gpuDelegate=false backend=XNNPACK"
            )
        }
    }

'''
          if marker not in text:
              raise SystemExit("YoloAnalyzer analyze marker not found")
          text = text.replace(marker, helper + marker, 1)
          yolo.write_text(text, encoding="utf-8", newline="\n")

          pose = Path("app/src/main/java/com/example/roomxxx0102/logic/analyzer/YoloPoseAnalyzer.kt")
          text = pose.read_text(encoding="utf-8")
          old = '''    companion object {
        private const val MODEL_FILE_NAME = "yolo11s_pose.tflite"
        private const val TAG = "YoloPoseAnalyzer"'''
          new = '''    companion object {
        private const val MODEL_FILE_NAME = "yolo26s_pose_float16.tflite"
        private const val MODEL_ARCHITECTURE = "YOLO26s-pose"
        private const val TAG = "YoloPoseAnalyzer"'''
          if old not in text:
              raise SystemExit("YoloPoseAnalyzer companion snippet not found")
          text = text.replace(old, new, 1)
          old = '''    private var interpreter: Interpreter? = null
    
    // [Model Input Size]'''
          new = '''    private var interpreter: Interpreter? = null
    private var gpuDelegate: GpuDelegate? = null
    
    // [Model Input Size]'''
          if old not in text:
              raise SystemExit("YoloPoseAnalyzer interpreter field snippet not found")
          text = text.replace(old, new, 1)
          old = '''            val options = Interpreter.Options()
            try {
                options.addDelegate(GpuDelegate())
            } catch (e: Exception) {
                options.setUseXNNPACK(true)
                options.setNumThreads(4)
            }
            
            interpreter = Interpreter(buffer, options)
            val inputTensor = interpreter!!.getInputTensor(0)
            val inputShape = inputTensor.shape()
            if (inputShape.size == 4) {
                if (inputShape[1] == 3) { modelInputHeight = inputShape[2]; modelInputWidth = inputShape[3] } 
                else { modelInputHeight = inputShape[1]; modelInputWidth = inputShape[2] }
            }
            val outputTensor = interpreter!!.getOutputTensor(0)
            val outputShape = outputTensor.shape()
            val channels = outputShape[1]
            val anchors = outputShape[2]
            
            modelOutputBuffer = Array(1) { Array(channels) { FloatArray(anchors) } }
            tensorImage = TensorImage(DataType.FLOAT32)'''
          new = '''            interpreter = createInterpreterWithFallback(buffer)
            val activeInterpreter = interpreter!!
            require(activeInterpreter.inputTensorCount == 1) {
                "$MODEL_ARCHITECTURE expects exactly 1 input tensor, got ${activeInterpreter.inputTensorCount}"
            }
            require(activeInterpreter.outputTensorCount == 1) {
                "$MODEL_ARCHITECTURE expects exactly 1 output tensor, got ${activeInterpreter.outputTensorCount}"
            }

            val inputTensor = activeInterpreter.getInputTensor(0)
            val inputShape = inputTensor.shape()
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE input[0]=" +
                    "shape=${inputShape.contentToString()} dtype=${inputTensor.dataType()}"
            )
            require(inputTensor.dataType() == DataType.FLOAT32) {
                "$MODEL_ARCHITECTURE input dtype must be FLOAT32, got ${inputTensor.dataType()}"
            }
            require(inputShape.contentEquals(intArrayOf(1, 640, 640, 3))) {
                "$MODEL_ARCHITECTURE unexpected input shape ${inputShape.contentToString()}"
            }
            modelInputHeight = inputShape[1]
            modelInputWidth = inputShape[2]

            val outputTensor = activeInterpreter.getOutputTensor(0)
            val outputShape = outputTensor.shape()
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE output[0]=" +
                    "shape=${outputShape.contentToString()} dtype=${outputTensor.dataType()}"
            )
            require(outputTensor.dataType() == DataType.FLOAT32) {
                "$MODEL_ARCHITECTURE output dtype must be FLOAT32, got ${outputTensor.dataType()}"
            }
            require(outputShape.contentEquals(intArrayOf(1, 56, 8400))) {
                "$MODEL_ARCHITECTURE unexpected output shape ${outputShape.contentToString()}"
            }
            val channels = outputShape[1]
            val anchors = outputShape[2]
            
            modelOutputBuffer = Array(1) { Array(channels) { FloatArray(anchors) } }
            tensorImage = TensorImage(DataType.FLOAT32)
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE ready=true " +
                    "channels=$channels anchors=$anchors externalNms=true"
            )'''
          if old not in text:
              raise SystemExit("YoloPoseAnalyzer setup snippet not found")
          text = text.replace(old, new, 1)
          old = '''        } catch (e: Exception) {
            interpreter = null
        }
    }

    // CameraX 接口实现'''
          new = '''        } catch (e: Exception) {
            interpreter = null
            Log.e(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE initializationFailed=true",
                e
            )
        }
    }

    private fun createInterpreterWithFallback(modelBuffer: java.nio.ByteBuffer): Interpreter {
        var candidateDelegate: GpuDelegate? = null
        try {
            candidateDelegate = GpuDelegate()
            val gpuOptions = Interpreter.Options().apply { addDelegate(candidateDelegate) }
            val gpuInterpreter = Interpreter(modelBuffer, gpuOptions)
            gpuDelegate = candidateDelegate
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE gpuDelegate=true backend=GPU"
            )
            return gpuInterpreter
        } catch (gpuError: Throwable) {
            try {
                candidateDelegate?.close()
            } catch (_: Throwable) {
            }
            gpuDelegate = null
            Log.w(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE gpuDelegate=false fallback=XNNPACK",
                gpuError
            )
        }

        modelBuffer.rewind()
        val cpuOptions = Interpreter.Options().apply {
            setUseXNNPACK(true)
            setNumThreads(4)
        }
        return Interpreter(modelBuffer, cpuOptions).also {
            Log.i(
                TAG,
                "model=$MODEL_FILE_NAME architecture=$MODEL_ARCHITECTURE gpuDelegate=false backend=XNNPACK"
            )
        }
    }

    // CameraX 接口实现'''
          if old not in text:
              raise SystemExit("YoloPoseAnalyzer catch marker not found")
          text = text.replace(old, new, 1)
          pose.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Configure Android SDK path for runner
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          sdk = os.environ.get("ANDROID_SDK_ROOT") or os.environ.get("ANDROID_HOME")
          if not sdk:
              raise SystemExit("Android SDK path not found")
          Path("local.properties").write_text(f"sdk.dir={sdk}\n", encoding="utf-8")
          PY

      - name: Run existing unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build YOLO26 debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Inspect YOLO26 APK assets and arm64 ABI
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import zipfile

          apks = list(Path("app/build/outputs/apk/debug").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected one debug APK, found {apks}")
          apk = apks[0]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
          required = {
              "assets/yolo26s_float16.tflite",
              "assets/yolo26s_pose_float16.tflite",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing YOLO26 assets in APK: {missing}")
          old = [n for n in names if "yolo11s" in n]
          if old:
              raise SystemExit(f"Old YOLO11 assets still packaged: {old}")
          arm64 = sorted(n for n in names if n.startswith("lib/arm64-v8a/"))
          if not arm64:
              raise SystemExit("No arm64-v8a native libraries found in APK")
          other_abis = sorted({n.split('/')[1] for n in names if n.startswith("lib/") and n.count('/') >= 2 and n.split('/')[1] != "arm64-v8a"})
          if other_abis:
              raise SystemExit(f"Unexpected non-arm64 native ABIs: {other_abis}")
          info = {
              "apk": str(apk),
              "bytes": apk.stat().st_size,
              "yolo26_assets": sorted(required),
              "arm64_native_entries": len(arm64),
              "other_native_abis": other_abis,
          }
          Path("/tmp/yolo26_apk_info.json").write_text(json.dumps(info, indent=2), encoding="utf-8")
          print("YOLO26_APK_INFO=" + json.dumps(info))
          PY

      - name: Build pre-task YOLO11 baseline APK for size comparison
        run: |
          git worktree add --detach /tmp/roomxxx-baseline 9fbe67ebd7e5a78da0f741d2be6754046a86a53d
          python - <<'PY'
          import os
          from pathlib import Path
          sdk = os.environ.get("ANDROID_SDK_ROOT") or os.environ.get("ANDROID_HOME")
          Path("/tmp/roomxxx-baseline/local.properties").write_text(f"sdk.dir={sdk}\n", encoding="utf-8")
          PY
          cd /tmp/roomxxx-baseline
          ./gradlew :app:assembleDebug --stacktrace
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path
          import json
          new_info = json.loads(Path("/tmp/yolo26_apk_info.json").read_text(encoding="utf-8"))
          old_apks = list(Path("/tmp/roomxxx-baseline/app/build/outputs/apk/debug").glob("*.apk"))
          if len(old_apks) != 1:
              raise SystemExit(f"Expected one baseline APK, found {old_apks}")
          old_apk = old_apks[0]
          result = {
              "baseline_commit": "9fbe67ebd7e5a78da0f741d2be6754046a86a53d",
              "baseline_apk_bytes": old_apk.stat().st_size,
              "yolo26_apk_bytes": new_info["bytes"],
              "delta_bytes": new_info["bytes"] - old_apk.stat().st_size,
          }
          Path("/tmp/apk_size_comparison.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print("APK_SIZE_COMPARISON=" + json.dumps(result))
          PY

      - name: Check for connected Android device
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          p = subprocess.run(["adb", "devices"], check=False, text=True, capture_output=True)
          print(p.stdout)
          lines = [line.strip() for line in p.stdout.splitlines()[1:] if line.strip()]
          devices = [line for line in lines if line.endswith("\tdevice")]
          status = "connected" if devices else "none"
          Path("/tmp/device_status.txt").write_text(status, encoding="utf-8")
          if devices:
              apk = next(Path("app/build/outputs/apk/debug").glob("*.apk"))
              install = subprocess.run(["adb", "install", "-r", str(apk)], check=False, text=True, capture_output=True)
              print(install.stdout)
              print(install.stderr)
              if install.returncode != 0:
                  raise SystemExit(f"adb install failed: {install.returncode}")
          PY

      - name: Update codex and dialogue history, remove temporary files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          size = json.loads(Path("/tmp/apk_size_comparison.json").read_text(encoding="utf-8"))
          device = Path("/tmp/device_status.txt").read_text(encoding="utf-8").strip()
          now = datetime.now(ZoneInfo("Asia/Taipei")).strftime("%Y-%m-%d %H:%M:%S")
          history = Path("codexHistory.md")
          text = history.read_text(encoding="utf-8")
          marker = "# Codex History\n\n"
          if not text.startswith(marker):
              raise SystemExit("Unexpected codexHistory header")
          entry = f'''## [393] {now} - 替换为 YOLO26s FP16 TFLite

**用户指令**：
> 将 Android APK 当前的 YOLO11s 检测/Pose 两套模型替换为官方 YOLO26s/YOLO26s-pose，保持现有业务链，实测 Tensor 并完成构建验证后提交推送。

**实现方案 (Implementation)**：

*   **变更摘要**
    *   任务目的：将 APK 感知模型直接升级到官方 YOLO26s / YOLO26s-pose FP16 TFLite，不增加运行时模型切换，不修改现有阈值、NMS、Tracker、ROI、房间判断、手势或绘制链。
    *   修改文件：`app/src/main/assets/yolo26s_float16.tflite`、`app/src/main/assets/yolo26s_pose_float16.tflite`、`YoloAnalyzer.kt`、`YoloPoseAnalyzer.kt`、`codexHistory.md`、`dialogueHistory.md`；移除旧 `yolo11s_float16.tflite`、`yolo11s_pose.tflite`。
    *   涉及方法：Ultralytics `YOLO.export`、LiteRT/TFLite Tensor 实测、`createInterpreterWithFallback`、启动 Tensor/后端日志、现有 raw-head 解析与外部 NMS。
    *   导出环境：Ultralytics 8.4.82；检测命令 `YOLO('yolo26s.pt').export(format='tflite', imgsz=640, half=True, batch=1, nms=False, end2end=False, int8=False, device='cpu')`；Pose 命令同参数使用 `yolo26s-pose.pt`。
    *   Tensor 实测：检测 `[1,640,640,3] FLOAT32 -> [1,84,8400] FLOAT32`；Pose `[1,640,640,3] FLOAT32 -> [1,56,8400] FLOAT32`；两者均单输入/单输出，无 Flex/Select TF Ops，因此原 raw-head 解析与外部 NMS 无需改变。
    *   GPU 策略：先创建 `GpuDelegate` 并实际构造 Interpreter；任一阶段失败后释放候选 delegate，再以 XNNPACK + 4 threads 重新构造 Interpreter，并记录后端日志。
    *   验证：`:app:testDebugUnitTest` 通过，`:app:assembleDebug` 通过；APK 中存在两套 YOLO26 资产、无 YOLO11 资产，native ABI 仅 arm64-v8a。
    *   APK 大小：YOLO11 基线 `{size['baseline_apk_bytes']}` bytes；YOLO26 `{size['yolo26_apk_bytes']}` bytes；变化 `{size['delta_bytes']:+d}` bytes。
    *   设备安装：{'runner 检测到设备并执行 adb install -r 成功' if device == 'connected' else 'GitHub hosted runner 未检测到 adb 设备，因此未执行真机安装'}。

---

'''
          history.write_text(marker + entry + text[len(marker):], encoding="utf-8", newline="\n")

          user_text = '''请在 GitHub 项目 jay52121/RoomXXX0102 的分支“9月新房间判定算法”上直接完成 YOLO26 替换，并提交、推送到当前分支。

开始前先读取仓库 AGENTS.md，并遵守历史日志规则。

目标：
把 Android APK 当前使用的两套 YOLO11s 模型直接替换为 YOLO26s。暂时不做版本切换 UI，不保留运行时双模型选择；如果存在兼容问题，直接修改解析层解决。

当前模型：
- app/src/main/assets/yolo11s_float16.tflite
- app/src/main/assets/yolo11s_pose.tflite

当前加载代码：
- YoloAnalyzer.kt
- YoloPoseAnalyzer.kt

当前运行方式：
- LiteRT / TensorFlow Lite
- GPU Delegate 优先
- 输入尺寸 640×640
- FLOAT32 输入归一化
- 模型权重使用 FP16
- 检测结果继续进入现有 Tracker、ROI、房间算法和绘制链路

实施要求：

1. 使用当前官方 Ultralytics YOLO26s：
   - 检测：yolo26s.pt
   - Pose：yolo26s-pose.pt

2. 导出 Android 可用的 TFLite：
   - imgsz=640
   - half=True / FP16
   - batch=1
   - 不内嵌 NMS，尽量保留原始输出
   - 不量化 INT8
   - 不引入 Flex/Select TF Ops，除非确实无法避免
   - 记录实际使用的 Ultralytics 版本和完整导出命令

3. 将模型放入 app/src/main/assets，名称建议：
   - yolo26s_float16.tflite
   - yolo26s_pose_float16.tflite

4. 修改 YoloAnalyzer 和 YoloPoseAnalyzer，使其直接加载 YOLO26 模型。

5. 必须实际读取导出模型的输入、输出 Tensor：
   - 检查输入 shape、dtype
   - 检查输出数量、shape、dtype
   - 不要假设 YOLO26 输出与 YOLO11 完全一致
   - 如果输出结构不同，修改检测与 Pose 解析器
   - 禁止为了编译通过而伪造解析逻辑

6. 保持现有业务行为：
   - 只识别人类类别的既有策略不变
   - 现有阈值暂时不改
   - NMS 行为不变
   - SimpleTracker / RemoteByteTrack 不变
   - Pose ROI、房间判断、手势识别、绘制逻辑不变
   - GPU Delegate 优先，失败后回退 XNNPACK
   - 不做无关重构

7. 增加清晰启动日志，至少输出：
   - 模型文件名
   - 输入 Tensor 信息
   - 输出 Tensor 信息
   - GPU Delegate 是否成功
   - 实际模型架构为 YOLO26

8. 验证：
   - 运行现有单元测试
   - 运行 :app:assembleDebug
   - 确认 arm64-v8a APK 能构建
   - 如果能连接设备，再运行安装验证
   - 说明 APK 大小变化
   - 检查两个 TFLite 文件确实被打包进 APK

9. Git：
