name: Apply V4.3 Visible Passby Veto

on:
  push:
    branches:
      - codex/v43-continuity-absorption

permissions:
  contents: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v43-continuity-absorption
          fetch-depth: 0
      - name: Apply visible pass-by veto
        run: python3 tools/_v43_visible_veto.py
      - name: Remove temporary files
        run: rm tools/_v43_visible_veto.py .github/workflows/v43-veto-test.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V4.3：可见路过门洞作为进入反证"
          git push origin HEAD:codex/v43-continuity-absorption
      - name: Unit tests
        run: bash gradlew :app:testDebugUnitTest --no-daemon
