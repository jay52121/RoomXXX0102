name: Temporary Web Debug Check
on:
  push:
    branches:
      - codex/sisp-structured-web-debug-v1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate structure-only HTML and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("app/src/main/assets/sisp_debug.html").read_text(encoding="utf-8")
          assert '<video' not in html.lower()
          assert '<img ' not in html.lower()
          assert 'getUserMedia(' not in html
          assert '<script>' in html and '</script>' in html
          Path('/tmp/sisp-web-script.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/sisp-web-script.js
      - name: Compile Android Kotlin and run targeted unit tests
        run: |
          chmod +x gradlew
          touch kws-sdk/consumer-rules.pro
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace
